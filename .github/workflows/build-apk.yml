name: Build Android APK

on:
  push:
    branches:
      - master
      - main
      - claude/**
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:        # lets you trigger a build manually from GitHub UI

jobs:
  build:
    name: Build & release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java (required by Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test test/unit_test.dart

      - name: Run widget tests
        run: flutter test test/widget_test.dart

      - name: Build debug APK (no signing needed for sideloading)
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          generate_release_notes: true
